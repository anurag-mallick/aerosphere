<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232747"/>
      <stop offset="1" stop-color="#0c0e1d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e94560"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#3b4a7a"/>
      <stop offset="1" stop-color="#141830"/>
    </radialGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>

  <!-- orbit ring (360°) -->
  <ellipse cx="512" cy="512" rx="345" ry="118" fill="none"
           stroke="url(#ring)" stroke-width="26" transform="rotate(-16 512 512)"/>

  <!-- sphere body -->
  <circle cx="512" cy="512" r="212" fill="url(#sphere)" stroke="#7dd3fc" stroke-width="26"/>

  <!-- meridian -->
  <ellipse cx="512" cy="512" rx="86" ry="212" fill="none" stroke="#7dd3fc" stroke-width="18" opacity="0.85"/>
  <!-- equator -->
  <ellipse cx="512" cy="512" rx="212" ry="60" fill="none" stroke="#7dd3fc" stroke-width="14" opacity="0.55"/>

  <!-- drone rotors, four corners -->
  <g stroke="#9aa6d8" stroke-width="20" fill="none" opacity="0.9">
    <circle cx="196" cy="196" r="58"/>
    <circle cx="828" cy="196" r="58"/>
    <circle cx="196" cy="828" r="58"/>
    <circle cx="828" cy="828" r="58"/>
  </g>
  <g stroke="#9aa6d8" stroke-width="16">
    <path d="M247 247 L340 340 M777 247 L684 340 M247 777 L340 684 M777 777 L684 684"/>
  </g>
</svg>
