name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          fi
      # CI never launches Electron — skip the ~100MB binary postinstall,
      # whose GitHub-release download is a known npm ci failure point
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run typecheck
      # full vitest suite — includes the real-ffmpeg integration tests
      # (composite export, demo round-trip). Kept in the default job since the
      # whole suite runs in well under a minute locally; 30-min job timeout
      # leaves ample headroom for slower macOS runners.
      - run: npm test
      - run: npm run build
